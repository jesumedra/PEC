{% extends "base.html" %}
{% block titulo %}Contacto | PEC{% endblock %}
{% block contenido %}
    <div class="page-header">
      <h1>Contacto</h1>
      <p>Envía tu opinión, una sugerencia o el reporte de un riesgo.</p>
    </div>

    <section class="contacto">
      <form id="formContacto" novalidate>
        <label for="tipo">¿Qué quieres enviar?</label>
        <select id="tipo" name="tipo" required aria-describedby="error-tipo">
          <option value="">Elige una opción</option>
          <option value="opinion">Una opinión</option>
          <option value="reporte">Un reporte de riesgo en la escuela</option>
          <option value="sugerencia">Una sugerencia</option>
        </select>
        <p class="campo-error" id="error-tipo"></p>

        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" name="nombre" maxlength="80" autocomplete="name" required aria-describedby="error-nombre">
        <p class="campo-error" id="error-nombre"></p>

        <label for="correo">Correo <span class="ayuda">(opcional)</span></label>
        <input type="email" id="correo" name="correo" maxlength="120" autocomplete="email" aria-describedby="error-correo">
        <p class="campo-error" id="error-correo"></p>

        <label for="mensaje">Mensaje</label>
        <textarea id="mensaje" name="mensaje" rows="5" maxlength="1000" required aria-describedby="ayuda-mensaje error-mensaje"
                  placeholder="Si es un reporte, di qué pasó y dónde (salón, patio, pasillo…)"></textarea>
        <p class="ayuda" id="ayuda-mensaje">No compartas datos personales de otras personas.</p>
        <p class="campo-error" id="error-mensaje"></p>

        <button type="submit" class="btn">Enviar mensaje</button>
        <p id="respuesta" role="status"></p>
      </form>
    </section>
{% endblock %}
